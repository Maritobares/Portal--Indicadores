<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Portal de Indicadores | Mutual 22 de Septiembre</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb}
    body{overflow:hidden}
    .topbar{
      height:64px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:0 16px;
      background:#0b4f8a;
      color:#fff;
      box-shadow:0 2px 12px rgba(0,0,0,.16);
      position:relative;
      z-index:2;
    }
    .brand{min-width:0}
    .brand strong{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand span{display:block;font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .user{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .email{
      max-width:210px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:12px;
      opacity:.95;
    }
    button{
      border:1px solid rgba(255,255,255,.35);
      background:#fff;
      color:#0b4f8a;
      border-radius:9px;
      padding:9px 12px;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
    }
    .portal-wrap{
      height:calc(100vh - 64px);
      position:relative;
      background:#fff;
    }
    iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#fff;
    }
    .fallback{
      position:absolute;
      inset:0;
      display:none;
      place-items:center;
      padding:24px;
      background:#f4f7fb;
      text-align:center;
      z-index:1;
    }
    .fallback-card{
      max-width:460px;
      background:#fff;
      padding:24px;
      border-radius:16px;
      box-shadow:0 12px 34px rgba(22,34,51,.12);
    }
    .fallback a{
      display:inline-block;
      margin-top:12px;
      background:#0b4f8a;
      color:#fff;
      text-decoration:none;
      padding:12px 16px;
      border-radius:9px;
      font-weight:700;
    }
    @media(max-width:700px){
      .topbar{height:72px;padding:0 10px}
      .portal-wrap{height:calc(100vh - 72px)}
      .brand span{display:none}
      .email{display:none}
      button{padding:9px 10px;font-size:12px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Portal de Indicadores</strong>
      <span>Asociación Mutual 22 de Septiembre</span>
    </div>
    <div class="user">
      <span id="email" class="email"></span>
      <button id="logout" type="button">Cerrar sesión</button>
    </div>
  </header>

  <main class="portal-wrap">
    <iframe id="portal" title="Portal de Indicadores"></iframe>

    <div id="fallback" class="fallback">
      <div class="fallback-card">
        <h2>No se pudo mostrar el portal dentro de esta página</h2>
        <p>Podés abrirlo en una nueva pestaña mientras continuamos con la migración definitiva.</p>
        <a id="openPortal" href="#" target="_blank" rel="noopener">Abrir portal</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
    import {
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      PORTAL_URL
    } from "./config.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const { data: { session } } = await supabase.auth.getSession();

    if (!session) {
      window.location.replace("./index.html");
    } else {
      document.getElementById("email").textContent =
        session.user.email ?? "Usuario autenticado";

      document.getElementById("portal").src = PORTAL_URL;
      document.getElementById("openPortal").href = PORTAL_URL;
    }

    document.getElementById("logout").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.replace("./index.html");
    });

    // Si el sitio remoto impide ser mostrado en iframe, se ofrece un enlace alternativo.
    const iframe = document.getElementById("portal");
    const fallback = document.getElementById("fallback");

    iframe.addEventListener("error", () => {
      iframe.style.display = "none";
      fallback.style.display = "grid";
    });
  </script>
</body>
</html>
